# decompiler.yml
name: Universal Decompiler Pipeline

on:
  workflow_dispatch:
    inputs:
      binary_url:
        description: 'URL of the target binary (.jar, .dll, .exe, or Go binary)'
        required: true
        type: string

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
          
      - name: Setup Java Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download Target Binary
        run: |
          INPUT_URL="${{ github.event.inputs.binary_url }}"
          
          # Automatically convert GitHub web UI blob links to raw file downloads
          if [[ "$INPUT_URL" == *"github.com"* && "$INPUT_URL" == *"/blob/"* ]]; then
            echo "Detected GitHub web URL. Formatting to a raw file link..."
            CLEAN_URL=$(echo "$INPUT_URL" | sed 's|github.com|://githubusercontent.com|' | sed 's|/blob/|/|')
          else
            CLEAN_URL="$INPUT_URL"
          fi

          FILENAME=$(basename "$CLEAN_URL")
          echo "Downloading binary from: $CLEAN_URL"
          
          wget "$CLEAN_URL" -O "$FILENAME"
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Detect Language and Decompile
        run: |
          EXTENSION="${FILENAME##*.}"
          echo "Detected extension: $EXTENSION"
          mkdir -p decompiled_code

          if [ "$EXTENSION" = "jar" ] || [ "$EXTENSION" = "class" ]; then
            echo "Processing Java binary..."
            wget https://github.com -O cfr.jar
            java -jar cfr.jar "$FILENAME" --outputdir decompiled_code

          elif [ "$EXTENSION" = "dll" ]; then
            echo "Processing C#/.NET binary..."
            dotnet tool install -g ilspy.cmdline
            export PATH="$PATH:$HOME/.dotnet/tools"
            ilspycmd "$FILENAME" -o decompiled_code

          elif [ "$EXTENSION" = "exe" ]; then
            # Verify if the EXE is .NET MSIL bytecode or Native (MSVC) Assembly
            if file "$FILENAME" | grep -q "mono\|.NET"; then
              echo "Processing C#/.NET Executable..."
              dotnet tool install -g ilspy.cmdline
              export PATH="$PATH:$HOME/.dotnet/tools"
              ilspycmd "$FILENAME" -o decompiled_code
            else
              echo "Processing Native MSVC Windows Executable..."
              # Grab official RetDec release build for Linux 
              wget https://github.com
              
              # Extract archive package
              tar -xf RetDec-v5.0-Linux-Release.tar.xz
              
              # Run pipeline into generated file tree
              ./retdec/bin/retdec-decompiler "$FILENAME" --output decompiled_code/msvc_recovered.c
            fi

          else
            echo "Processing Go / Native compiled binary..."
            wget https://github.com -O jellyfish
            chmod +x jellyfish
            ./jellyfish decompile "$FILENAME" > decompiled_code/go_recovered.go || echo "Go recovery partial"
          fi

      - name: Upload Decompiled Source
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-source
          path: decompiled_code/
