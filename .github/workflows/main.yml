name: Create Release

on:
  push:
    tags:
      - 'v*' # Triggers workflow on version tags like v1.0.0

permissions:
  contents: write # Required to upload assets to releases

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Archive repository
        run: zip -r repository-archive.zip . -x "*.git*" # Compresses repo, excludes Git files

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: repository-archive.zip
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
