name: Manual Create Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true
        type: string
      release_title:
        description: 'Release Title (e.g., Version 1.0.0 Gold)'
        required: true
        type: string
      release_notes:
        description: 'Release Notes / Description'
        required: false
        type: string
        default: 'Manual production release archive.'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Archive repository
        run: zip -r repository-archive.zip . -x "*.git*"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: repository-archive.zip
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_title }}
          body: ${{ inputs.release_notes }}
          draft: false
          prerelease: false
